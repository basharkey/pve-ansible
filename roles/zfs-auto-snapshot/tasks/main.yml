---
# https://github.com/zfsonlinux/zfs-auto-snapshot
- name: Copy script
  copy:
    src: zfs-auto-snapshot.sh
    dest: /usr/local/sbin/zfs-auto-snapshot
    mode: '0755'

- name: Copy man page
  copy:
    src: zfs-auto-snapshot.8
    dest: /usr/local/share/man/man8/zfs-auto-snapshot.8

- name: Copy cron jobs
  copy:
    src: "{{ item.src }}"
    dest:  "{{ item.dest }}"
  loop:
    - src: zfs-auto-snapshot.cron.weekly
      dest: /etc/cron.weekly/zfs-auto-snapshot.cron.weekly
    - src: zfs-auto-snapshot.cron.monthly
      dest: /etc/cron.monthly/zfs-auto-snapshot.cron.monthly
